name: PR Build Verification

on:
  workflow_dispatch:
  pull_request:

permissions: read-all

jobs:
  build-pr:
    name: Verify compilation and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile
        run: ./mvnw compile -B -q
      - name: Test
        run: ./mvnw test -pl . -Dtest=org.springframework.data.util.VersionUnitTests -B -q